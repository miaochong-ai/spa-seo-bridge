# nginx：按 UA 把爬虫分流到直出服务
# 全文可粘贴进 conf.d/，改三处：server_name、SSL 证书路径、上游端口。

# ① 判 UA。false positive 说明：`~*bot` 会误伤 CUBOT 等手机机型，
#    所以真实项目里建议"精确名单 + 宽泛兜底"两段，并把误伤机型排除掉。
map $http_user_agent $mc_seo_bot {
    default                                                          0;
    ""                                                               0;
    # 有明确 UA 的主流搜索与 AI 爬虫
    ~*(googlebot|google-inspectiontool|bingbot|msnbot|baiduspider|sogou|360spider|yisouspider|bytespider|petalbot|yandex|applebot|duckduckbot)  1;
    # 生成式引擎（GEO）：这些 bot 不执行 JS，拿不到 SPA 的任何内容
    ~*(gptbot|oai-searchbot|chatgpt-user|claude-web|claudebot|anthropic-ai|perplexitybot|ccbot|google-extended|meta-externalagent)  1;
    # 宽泛兜底（含 bingbot.com、ahrefsbot、semrushbot 等）
    ~*(crawler|spider|bot)                                           1;
}

# ② 选后端。注意：这里给的是 host:port，proxy_pass 用变量时不会自动带 URI，
#    但会带规范化后的请求 URI，所以 /blog/xxx 能原样透传。
map $mc_seo_bot $mc_upstream {
    0  "127.0.0.1:8080";   # SPA / 业务后端（Vue 打包产物在这里）
    1  "127.0.0.1:8090";   # Python 直出服务
}

# ③ 静态资源白名单：扩展名命中就一律回源到 SPA，任何人都不走直出。
map $uri $mc_is_asset {
    default                                            0;
    ~*\.(js|css|png|jpg|jpeg|gif|webp|avif|svg|ico|woff|woff2|ttf|otf|map|mp4|webm)$   1;
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/nginx/ssl/example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;

    # 直出服务也用 gzip，否则 4000 字中文 HTML 传起来比 SPA 的 JSON 还慢
    gzip on;
    gzip_types text/html application/xml text/plain text/css application/javascript;

    # ---- 静态资源：永远走 SPA ----
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|avif|svg|ico|woff|woff2|ttf|otf|map|mp4|webm)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        expires 30d;
    }

    # ---- 其余全部：爬虫 → 直出，普通用户 → SPA ----
    location / {
        proxy_pass http://$mc_upstream;          # 变量形式，见下方注释
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
        # 直出服务挂了不要让爬虫吃 502，退回到 SPA 至少是个能跑的页面
        proxy_next_upstream error timeout http_502;
    }

    # ---- 日志里带一个标记，方便事后统计到底来了哪些爬虫 ----
    access_log /var/log/nginx/access.log mc_seo_fmt;
}

log_format mc_seo_fmt '$remote_addr - [$time_local] "$request" $status '
                      'bot=$mc_seo_bot ua="$http_user_agent"';

# ---------------------------------------------------------------------------
# 三个坑（都是踩过的，不是理论风险）
#
# 1) 不要写 if：
#      if ($mc_seo_bot) { proxy_pass http://127.0.0.1:8090; }     ← 官方警告
#    nginx 的 if 是"重写阶段"的东西，跟 proxy_pass 混用会出现不可预期的行为。
#    正确的做法就是上面这种 map 出变量再 proxy_pass。
#
# 2) proxy_pass 到变量时，必须显式 proxy_set_header Host $host。
#    不写的话，后端收到的 Host 是变量本身的值，一些按 Host 做站点路由的框架
#    会直接返回 404（这个坑排查了很久：用 curl 打 127.0.0.1 是 404，
#    打真实域名才 200）。
#
# 3) 直出服务只接 HTML 路由。任何 .js/.css 请求一旦被转过去，
#    爬虫会拿到一段"有正文但没有样式"的 HTML，渲染质量分反而下降。
#    所以上面单独写了静态资源 location，顺序在 location / 之前（正则优先）。
#
# 上线前：nginx -t && nginx -s reload
